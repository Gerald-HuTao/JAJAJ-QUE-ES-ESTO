<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SÉ MI SIX DE MI SEVEN — ULTIMATE PERSONA 5 EDITION</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   1. PALETA PERSONA 5 EXTREMA Y VARIABLES GLOBALES
   ══════════════════════════════════════════════════════════════════════════ */
:root {
  --p5-black: #050508;
  --p5-deep: #0b0b12;
  --p5-darkgray: #171722;
  --p5-midgray: #292938;
  --p5-red: #e60012;
  --p5-crimson: #b8000e;
  --p5-white: #ffffff;
  --p5-offwhite: #f2f0f5;
  --p5-gold: #ffd400;
  --p5-cyan: #00e5ff;
  --fx-red: #e60012;
  --fx-cherry: #ff2d55;
  --fx-blue: #2f6bff;
  --fx-cyan: #00e5ff;
  --fx-gold: #ffd400;
  --p5-font-display: Impact, 'Arial Black', 'Franklin Gothic Heavy', sans-serif;
  --p5-font-ui: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--p5-black);
  color: var(--p5-white);
  font: 15.5px/1.45 var(--p5-font-ui);
  overflow-x: hidden;
}
::selection { background: var(--p5-red); color: var(--p5-white); }

/* ══════════════════════════════════════════════════════════════════════════
   2. TRAMAS URBANAS, HALFTONE, RUIDO Y ESCENARIO DEL METRO DE PERSONA 5
   ══════════════════════════════════════════════════════════════════════════ */
.fx-host { position: relative; isolation: isolate; overflow: hidden; }
.fx-stage {
  position: fixed; inset: 0; z-index: -3; overflow: hidden;
  pointer-events: none; background: var(--p5-black);
}
.fx-layer {
  position: absolute; inset: -2.5%;
  transition: transform .22s ease-out;
  transform: translate3d(calc(var(--px,0)*-18px), calc(var(--py,0)*-11px), 0);
  animation: fxIn .65s ease-out both;
  will-change: transform;
}
.fx-layer > img:not(.fx-overlay):not(.fx-fill) {
  position: relative; width: 100%; height: 100%;
  object-fit: cover; display: block; user-select: none;
}
.fx-m-kenburns > img { animation: fxKen 20s ease-in-out infinite alternate; }

/* Trama Halftone Cómic + Barrido Diagonal + Viñeta Agresiva */
.fx-stage::before {
  content: ""; position: absolute; inset: 0; z-index: 2;
  opacity: .24; mix-blend-mode: overlay;
  background:
    radial-gradient(#000 1.5px, transparent 2px) 0 0 / 8px 8px,
    repeating-linear-gradient(-25deg, rgba(230,0,18,.08) 0 14px, transparent 14px 28px);
  animation: fxDots 14s linear infinite;
}
.fx-stage::after {
  content: ""; position: absolute; inset: 0; z-index: 3;
  background:
    linear-gradient(115deg, transparent 42%, rgba(230,0,18,.14) 50%, transparent 58%) -150% 0 / 250% 100% no-repeat,
    radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.85) 100%);
  animation: fxSweep 7s ease-in-out infinite, fxFlick 5s steps(1) infinite;
}

#p5-subway-stage {
  position: fixed; inset: 0; z-index: -2;
  pointer-events: none; overflow: hidden;
  transform: translate3d(calc(var(--px,0)*-12px), calc(var(--py,0)*-8px), 0);
  transition: transform .2s ease-out, opacity .4s ease;
}
#p5-subway-stage svg {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
}
.train-windows { animation: trainRush 1.25s linear infinite; }
.train-body-group { animation: trainBounce 0.42s ease-in-out infinite alternate; }
.subway-lights { animation: lightFlicker 4s steps(1) infinite; }
.thief-silhouette {
  transform-origin: bottom center;
  animation: thiefBreath 3.2s ease-in-out infinite alternate;
}
.thief-silhouette.d2 { animation-delay: -1.1s; }
.thief-silhouette.d3 { animation-delay: -2.2s; }

@keyframes trainRush { from { transform: translateX(0); } to { transform: translateX(260px); } }
@keyframes trainBounce { from { transform: translateY(0); } to { transform: translateY(2.2px); } }
@keyframes lightFlicker { 0%, 91%, 94%, 98%, 100% { opacity: .95; } 92%, 96% { opacity: .52; } }
@keyframes thiefBreath { from { transform: scaleY(1) skewX(0deg); } to { transform: scaleY(1.02) skewX(-0.9deg); } }

#p5-canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

/* ══════════════════════════════════════════════════════════════════════════
   3. RETRATOS STANDEE DE PERSONAJES Y CUT-IN CINEMATOGRÁFICO
   ══════════════════════════════════════════════════════════════════════════ */
#p5-char-showcase {
  position: fixed; inset: 0; z-index: 2;
  pointer-events: none; overflow: hidden;
}
.char-standee {
  position: absolute; bottom: -2%;
  width: clamp(300px, 44vw, 650px);
  height: clamp(400px, 86vh, 840px);
  transition: transform .55s cubic-bezier(.16,1,.3,1), opacity .45s ease;
  filter: drop-shadow(10px 10px 0 var(--p5-red)) drop-shadow(18px 18px 0 #000);
  will-change: transform;
}
.char-standee svg { width: 100%; height: 100%; overflow: visible; }
#app[data-pos=l] .char-standee,
#app[data-pos=m] .char-standee {
  right: -2%; left: auto;
  animation: standeeInRight .6s cubic-bezier(.16,1,.3,1) both;
}
#app[data-pos=r] .char-standee {
  left: -2%; right: auto;
  filter: drop-shadow(-10px 10px 0 var(--p5-red)) drop-shadow(-18px 18px 0 #000);
  animation: standeeInLeft .6s cubic-bezier(.16,1,.3,1) both;
}
#app[data-pos=c] .char-standee {
  right: -4%; bottom: 3%;
  width: clamp(260px, 34vw, 490px);
  animation: standeeInRight .6s cubic-bezier(.16,1,.3,1) both;
}

@keyframes standeeInRight {
  from { opacity: 0; transform: translateX(120px) skewX(-8deg) scale(.92); }
  to { opacity: 1; transform: translate3d(calc(var(--px,0)*-22px), calc(var(--py,0)*-12px), 0); }
}
@keyframes standeeInLeft {
  from { opacity: 0; transform: translateX(-120px) skewX(8deg) scale(.92); }
  to { opacity: 1; transform: translate3d(calc(var(--px,0)*-22px), calc(var(--py,0)*-12px), 0); }
}

.p5-cutin {
  position: fixed; left: -10%; right: -10%; top: 18%;
  height: clamp(110px, 18vh, 165px);
  background: #000;
  border-top: 6px solid #fff;
  border-bottom: 8px solid var(--p5-red);
  transform: rotate(-7deg) scaleY(0);
  z-index: 9995; pointer-events: none;
  box-shadow: 0 20px 60px rgba(0,0,0,.95), 0 0 0 5px #000;
  overflow: hidden;
  animation: cutInAnim 1.02s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes cutInAnim {
  0% { transform: rotate(-7deg) scaleY(0) translateX(-30%); opacity: 0; }
  18% { transform: rotate(-7deg) scaleY(1.05) translateX(0); opacity: 1; }
  75% { transform: rotate(-7deg) scaleY(1) translateX(2%); opacity: 1; }
  100% { transform: rotate(-7deg) scaleY(0) translateX(35%); opacity: 0; }
}

.fx-slash { position: fixed; inset: 0; z-index: 9999; pointer-events: none; overflow: hidden; }
.fx-slash i {
  position: absolute; top: -15%; bottom: -15%; left: -75%; width: 70%;
  transform: skewX(-22deg);
  animation: fxSlash .7s cubic-bezier(.7,0,.25,1) both;
}
.fx-slash i:nth-child(1) { background: #000; border-right: 7px solid #fff; animation-delay: 0s; }
.fx-slash i:nth-child(2) { background: var(--p5-red); border-right: 9px solid #000; animation-delay: .055s; }
.fx-slash i:nth-child(3) { background: #fff; border-right: 6px solid var(--p5-red); animation-delay: .11s; }

.fx-in { animation: fxPop .5s cubic-bezier(.2,.95,.25,1.2) var(--d,0ms) both; }
.fx-bar > i { display: block; height: 100%; width: calc(var(--v,0)*1%); transition: width 1s cubic-bezier(.2,.8,.2,1); }
.fx-pop { animation: fxBig .7s cubic-bezier(.2,.9,.25,1.3); text-shadow: 5px 5px 0 var(--p5-red), 10px 10px 0 #000; }
.fx-p {
  position: fixed; z-index: 9998; pointer-events: none;
  font-size: 20px; color: var(--p5-red);
  text-shadow: 2px 2px 0 #000, 0 0 8px #fff;
  animation: fxBurst .9s ease-out forwards;
}

@keyframes fxIn { from { opacity: 0; scale: 1.08; } to { opacity: 1; scale: 1; } }
@keyframes fxKen { from { transform: scale(1); } to { transform: scale(1.06) translate(-.8%,-.5%); } }
@keyframes fxDots { to { background-position: 8px 8px, 28px 0; } }
@keyframes fxSweep { 0%, 55% { background-position: -150% 0, 0 0; } 100% { background-position: 150% 0, 0 0; } }
@keyframes fxFlick { 0%, 92% { opacity: 1; } 93% { opacity: .86; } 94% { opacity: 1; } 96% { opacity: .91; } 97% { opacity: 1; } }
@keyframes fxSlash { 0% { left: -75%; } 45%, 55% { left: 18%; } 100% { left: 125%; } }
@keyframes fxPop { from { opacity: 0; transform: translateY(18px) skewX(-7deg); } to { opacity: 1; transform: none; } }
@keyframes fxBig { 0% { transform: scale(.55); opacity: .35; } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes fxBurst { to { transform: translate(var(--dx),var(--dy)) rotate(var(--r)); opacity: 0; } }

/* ══════════════════════════════════════════════════════════════════════════
   4. ARQUITECTURA DE MENÚS Y TARJETAS INCLINADAS PERSONA 5
   ══════════════════════════════════════════════════════════════════════════ */
#app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

#shade {
  position: fixed; inset: 0; z-index: 1; pointer-events: none; transition: background .5s;
  background:
    linear-gradient(0deg, rgba(0,0,0,.9) 0%, transparent 48%),
    linear-gradient(90deg, rgba(0,0,0,.78) 0%, transparent 60%);
}
#app[data-pos=r] #shade {
  background:
    linear-gradient(0deg, rgba(0,0,0,.9) 0%, transparent 48%),
    linear-gradient(270deg, rgba(0,0,0,.78) 0%, transparent 60%);
}
#app[data-pos=c] #shade {
  background:
    linear-gradient(0deg, rgba(0,0,0,.92) 0%, transparent 55%),
    linear-gradient(180deg, rgba(0,0,0,.74) 0%, transparent 42%);
}

#hud, #view { position: relative; z-index: 4; }
#hud {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: max(10px, env(safe-area-inset-top)) clamp(14px, 3vw, 36px) 14px;
  background: linear-gradient(180deg, rgba(0,0,0,.95) 0%, rgba(15,0,4,.75) 68%, transparent 100%);
  border-bottom: 2px solid rgba(230,0,18,.45);
}
#hud[hidden] { display: none !important; }

#crumb {
  flex: 1; min-width: 180px;
  font: italic 900 15px/1.1 var(--p5-font-display);
  letter-spacing: .1em; text-transform: uppercase;
  text-shadow: 2px 2px 0 #000, 3px 3px 0 var(--p5-red);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#crumb::before {
  content: "★ "; color: var(--p5-red);
  text-shadow: 1px 1px 0 #fff;
}

.hud-thief-pill {
  background: var(--p5-red); color: #fff;
  border: 2px solid #fff;
  padding: 3px 10px;
  font: italic 900 12px var(--p5-font-display);
  letter-spacing: .07em;
  transform: skewX(-12deg);
  box-shadow: 3px 3px 0 #000;
}

#view {
  flex: 1; display: flex; flex-direction: column;
  justify-content: flex-end; align-items: flex-start;
  padding: 8px clamp(14px, 3.2vw, 44px) clamp(16px, 3.2vh, 34px);
  gap: 12px;
}

/* Paneles inclinados con recortes agresivos en negro, rojo y blanco */
.panel {
  position: relative;
  width: min(670px, 100%);
  background:
    repeating-linear-gradient(-35deg, rgba(255,255,255,.02) 0 8px, transparent 8px 16px),
    linear-gradient(135deg, rgba(6,6,10,.97) 0%, rgba(24,3,8,.94) 100%);
  border: 3.5px solid #fff;
  border-left: 14px solid var(--p5-red);
  padding: 20px 24px;
  backdrop-filter: blur(6px);
  box-shadow:
    9px 9px 0 var(--p5-red),
    15px 15px 0 #000,
    0 18px 44px rgba(0,0,0,.9);
}
.panel::before {
  content: ""; position: absolute; left: -14px; top: -10px;
  width: 44px; height: 14px;
  background: #fff; border: 2.5px solid #000;
  transform: skewX(-28deg);
}
.panel::after {
  content: ""; position: absolute; right: 16px; top: -9px;
  width: 92px; height: 12px;
  background: var(--p5-red);
  border: 2.5px solid #fff;
  box-shadow: 4px 4px 0 #000;
  transform: skewX(-28deg);
}
.panel.wide { width: min(940px, 100%); }
.panel h2 {
  margin: 0 0 10px;
  font: italic 900 clamp(22px, 3.6vw, 31px)/1.05 var(--p5-font-display);
  letter-spacing: .04em; text-transform: uppercase;
  text-shadow: 3px 3px 0 var(--p5-red), 6px 6px 0 #000;
}

/* Logotipo Calling Card Ransom Style */
.logo {
  font: italic 900 clamp(34px, 7.2vw, 66px)/.92 var(--p5-font-display);
  margin: 0 0 10px;
  transform: skewX(-10deg) rotate(-1.8deg);
  text-transform: uppercase;
  color: #fff;
  -webkit-text-stroke: 2px #000;
  text-shadow:
    -3px -3px 0 #000,
    5px 5px 0 #000,
    9px 9px 0 var(--p5-red),
    13px 13px 0 #000;
}
.logo b {
  display: inline-block;
  color: #fff;
  background: var(--p5-red);
  border: 3px solid #fff;
  padding: 0 11px;
  margin: 0 3px;
  transform: skewX(7deg) rotate(2deg);
  box-shadow: 5px 5px 0 #000, 8px 8px 0 var(--p5-red);
}
.logo span.invert-cut {
  display: inline-block;
  background: #fff; color: #000;
  border: 3px solid #000;
  padding: 0 8px;
  transform: skewX(-6deg) rotate(-2deg);
  text-shadow: none;
  -webkit-text-stroke: 0;
  box-shadow: 4px 4px 0 var(--p5-red);
}

.sub { font-weight: 800; font-size: 15.5px; margin: 0 0 12px; letter-spacing: .03em; }
.sub em {
  color: #fff; background: var(--p5-red);
  border: 2px solid #fff;
  padding: 2px 10px; font-style: italic; font-weight: 900;
  display: inline-block; transform: skewX(-12deg);
  box-shadow: 3px 3px 0 #000;
}

.intro p { margin: 6px 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }

/* ══════════════════════════════════════════════════════════════════════════
   5. BOTONES ESTILO COMANDO DE BATALLA PERSONA 5
   ══════════════════════════════════════════════════════════════════════════ */
.btn {
  cursor: pointer; position: relative;
  border: 2.5px solid #fff;
  background: #07070c; color: #fff;
  padding: 10px 18px;
  font: italic 900 14px/1.1 var(--p5-font-display);
  letter-spacing: .08em; text-transform: uppercase;
  transform: skewX(-12deg);
  box-shadow: 4px 4px 0 var(--p5-red), 8px 8px 0 #000;
  transition: transform .15s cubic-bezier(.2,.9,.3,1.3), background-color .15s, color .15s, box-shadow .15s, border-color .15s;
}
.btn:hover {
  background: #fff; color: #000;
  border-color: var(--p5-red);
  transform: skewX(-12deg) translate(-3px, -3px) scale(1.05);
  box-shadow: 6px 6px 0 var(--p5-red), 11px 11px 0 #000;
}
.btn:active {
  transform: skewX(-12deg) translate(1px, 1px) scale(.98);
}
.btn.main {
  background: var(--p5-red); border-color: #fff; color: #fff;
  box-shadow: 5px 5px 0 #fff, 9px 9px 0 #000;
}
.btn.main:hover {
  background: #fff; color: var(--p5-red); border-color: #000;
  box-shadow: 6px 6px 0 var(--p5-red), 11px 11px 0 #000;
}
.btn.gold {
  background: var(--p5-gold); color: #000; border-color: #000;
  box-shadow: 5px 5px 0 var(--p5-red), 9px 9px 0 #000;
}
.btn.gold:hover {
  background: #fff; color: #000; border-color: var(--p5-red);
}
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn.sm { padding: 6px 12px; font-size: 12px; }
.btn.off { opacity: .55; }

/* ══════════════════════════════════════════════════════════════════════════
   6. FORMULARIO DE IDENTIFICACIÓN «IDENTIFÍCATE, LADRÓN DE CORAZONES»
   ══════════════════════════════════════════════════════════════════════════ */
.id-box {
  background: linear-gradient(135deg, rgba(230,0,18,.16) 0%, rgba(0,0,0,.85) 100%);
  border: 2.5px solid #fff;
  border-left: 8px solid var(--p5-red);
  padding: 14px 16px;
  margin: 12px 0;
  transform: skewX(-4deg);
  box-shadow: 5px 5px 0 #000;
}
.id-box label {
  display: flex; justify-content: space-between; align-items: center;
  font: italic 900 14.5px var(--p5-font-display);
  letter-spacing: .07em; text-transform: uppercase;
  color: #fff; margin-bottom: 8px;
}
.id-input-wrap {
  display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap;
}
.p5-input {
  flex: 1; min-width: 200px;
  background: #000; color: #fff;
  border: 3px solid #fff;
  padding: 11px 14px;
  font: 800 16px var(--p5-font-ui);
  letter-spacing: .04em;
  outline: none;
  box-shadow: inset 0 0 12px rgba(230,0,18,.35), 4px 4px 0 var(--p5-red);
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
.p5-input:focus {
  border-color: var(--p5-red);
  box-shadow: inset 0 0 14px rgba(230,0,18,.55), 5px 5px 0 #fff;
  transform: translateY(-1px);
}
.p5-input.input-error {
  border-color: var(--p5-gold);
  animation: p5Shake .28s ease-out;
}
.char-counter {
  font: italic 900 12.5px var(--p5-font-display);
  color: #fff; background: var(--p5-darkgray);
  border: 2px solid #fff; padding: 2px 8px;
}
.id-error-msg {
  color: var(--p5-gold);
  font-weight: 800; font-size: 13px;
  margin-top: 6px;
  text-shadow: 1px 1px 0 #000;
}
.rules-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
  gap: 8px; margin: 10px 0 6px;
}
.rule-item {
  background: rgba(15,15,24,.9);
  border: 1.5px solid rgba(255,255,255,.55);
  border-left: 5px solid var(--p5-red);
  padding: 7px 10px;
  font-size: 12.8px; font-weight: 700;
}
.rule-item b {
  display: block; color: var(--p5-red);
  font: italic 900 12px var(--p5-font-display);
  letter-spacing: .06em; text-transform: uppercase;
}

/* ══════════════════════════════════════════════════════════════════════════
   7. INDICADOR ESPECTACULAR DE 10 ESTACIONES + MEDIDOR DE QUÍMICA EN VIVO
   ══════════════════════════════════════════════════════════════════════════ */
.qbox { width: min(650px, 100%); }
.qtop { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 900; flex-wrap: wrap; }

.p5-progress-rail {
  display: flex; align-items: center; justify-content: space-between;
  gap: 4px; margin: 10px 0 12px; padding: 8px 10px;
  background: #06060a;
  border: 2px solid #fff;
  border-left: 6px solid var(--p5-red);
  transform: skewX(-10deg);
  box-shadow: 4px 4px 0 var(--p5-red), 7px 7px 0 #000;
}
.p5-node {
  flex: 1; height: 24px;
  display: flex; align-items: center; justify-content: center;
  font: italic 900 11.5px var(--p5-font-display);
  background: #181822; color: #777;
  border: 1.5px solid #444;
  transform: skewX(-8deg);
  position: relative;
  transition: transform .2s, background-color .2s, color .2s, border-color .2s;
}
.p5-node.done {
  background: var(--p5-red); color: #fff;
  border-color: #fff;
  box-shadow: 2px 2px 0 #000;
}
.p5-node.active {
  background: #fff; color: #000;
  border: 2px solid var(--p5-red);
  transform: skewX(-8deg) scale(1.16);
  z-index: 2;
  box-shadow: 0 0 12px rgba(230,0,18,.95), 3px 3px 0 var(--p5-red);
}

.pbar {
  flex: 1; min-width: 110px; height: 11px; background: #14141d;
  border: 2px solid #fff; transform: skewX(-16deg); padding: 1px;
}
.pbar i {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--p5-red), #fff);
  transition: width .45s cubic-bezier(.2,.9,.2,1);
}

/* Medidor de Química en Vivo */
.chem-meter {
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(90deg, #090910, #1f040b);
  border: 2px solid rgba(255,255,255,.75);
  border-left: 6px solid var(--p5-red);
  padding: 6px 11px; margin-bottom: 8px;
  font-size: 12.5px; font-weight: 800;
}
.chem-heart {
  font-size: 18px; color: var(--p5-red);
  text-shadow: 0 0 8px var(--p5-red);
  animation: heartPulse 1.1s ease-in-out infinite;
}
@keyframes heartPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.24) rotate(-6deg); }
}
.chem-track {
  flex: 1; height: 9px; background: #151520;
  border: 1.5px solid #fff; transform: skewX(-16deg); overflow: hidden;
}
.chem-fill {
  height: 100%;
  background: repeating-linear-gradient(45deg, var(--p5-red) 0 8px, #ff4b5c 8px 16px);
  transition: width .45s cubic-bezier(.2,.9,.2,1);
}
.chem-status {
  font: italic 900 11.5px var(--p5-font-display);
  color: #fff; background: var(--p5-red);
  padding: 1px 7px; border: 1.5px solid #fff;
  transform: skewX(-10deg);
}

.tag {
  display: inline-block; background: var(--p5-red); color: #fff;
  border: 2px solid #fff; padding: 2px 11px;
  font: italic 900 12px var(--p5-font-display);
  transform: skewX(-12deg); text-transform: uppercase;
  box-shadow: 3px 3px 0 #000;
}
.tag.ev { background: var(--p5-gold); color: #000; border-color: #000; }
.tag.cat { background: #000; color: #fff; border-color: var(--p5-red); }
.q-counter {
  font: italic 900 13px var(--p5-font-display);
  color: #000; background: #fff;
  border: 2px solid var(--p5-red);
  padding: 2px 9px;
  transform: skewX(-12deg);
  letter-spacing: .05em;
}

#qt { font-size: 19px; font-weight: 800; margin: 8px 0 4px; min-height: 2.3em; text-shadow: 2px 2px 0 #000; }

.obox {
  width: min(650px, 100%);
  padding: 12px 16px 15px;
  background: linear-gradient(95deg, rgba(5,5,9,.96), rgba(22,3,8,.88));
  border: 2.5px solid #fff;
  border-left: 9px solid var(--p5-red);
  backdrop-filter: blur(5px);
  box-shadow: 7px 7px 0 var(--p5-red), 12px 12px 0 #000;
}
.opt {
  display: block; width: 100%; margin: 8px 0; padding: 11px 14px 11px 38px;
  background: rgba(12,12,18,.94); color: #fff;
  border: 2px solid rgba(255,255,255,.65);
  border-left: 6px solid var(--p5-red);
  text-align: left; font: 700 15px var(--p5-font-ui);
  cursor: pointer; position: relative;
  transition: transform .16s cubic-bezier(.2,.9,.3,1.3), background-color .16s, color .16s, border-color .16s, box-shadow .16s;
}
.opt::before {
  content: "★"; position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%); color: var(--p5-red); font-size: 15px;
}
.opt:hover {
  transform: translateX(10px) skewX(-5deg);
  background: #1f050a;
  border-color: #fff;
  box-shadow: 4px 4px 0 var(--p5-red);
}
.opt:hover::before { color: #fff; }
.opt.is-selected {
  background: #fff;
  color: #000;
  border-color: var(--p5-red);
  border-left: 10px solid var(--p5-red);
  box-shadow: 6px 6px 0 var(--p5-red), 10px 10px 0 #000;
  font-weight: 900;
  transform: translateX(12px) skewX(-6deg);
}
.opt.is-selected::before { color: var(--p5-red); }

/* Posiciones dinámicas por pregunta */
#app[data-pos=r] #view { align-items: flex-end; }
#app[data-pos=r] .qbox { border-left-width: 3.5px; border-right: 14px solid var(--p5-red); }
#app[data-pos=r] .obox { border-left: 2.5px solid #fff; border-right: 9px solid var(--p5-red); }
#app[data-pos=r] .rob { align-self: flex-start; flex-direction: row-reverse; }

#app[data-pos=c] #view { align-items: center; }
#app[data-pos=c] .qbox { margin-bottom: auto; text-align: center; width: min(780px, 100%); }
#app[data-pos=c] .qtop { justify-content: center; }
#app[data-pos=c] .obox {
  width: min(900px, 100%); display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px;
  border-top: 7px solid var(--p5-red);
}
#app[data-pos=c] .obox .row { grid-column: 1 / -1; justify-content: space-between; }

#app[data-pos=m] #view { justify-content: center; }
#app[data-pos=m] .qbox, #app[data-pos=m] .obox { width: min(540px, 100%); }
#app[data-pos=m] .rob { position: fixed; right: clamp(14px, 3vw, 40px); bottom: clamp(14px, 3vh, 34px); }

/* Roberto y Globos de Diálogo */
.rob {
  align-self: flex-end; display: flex; align-items: flex-end;
  gap: 10px; max-width: min(430px, 100%); margin-top: 4px; z-index: 6;
}
.bub {
  background: #fff; color: #000; padding: 10px 14px;
  border: 3px solid #000;
  font-size: 13.5px; font-weight: 800;
  transform: skewX(-6deg);
  box-shadow: 5px 5px 0 var(--p5-red), 9px 9px 0 #000;
}
.bub b.char-tag {
  display: inline-block; background: var(--p5-red); color: #fff;
  padding: 1px 7px; margin-right: 5px; font: italic 900 10.5px var(--p5-font-display);
  letter-spacing: .08em; border: 1.5px solid #000;
}
.cuca {
  font-size: 40px; display: inline-block; cursor: pointer;
  filter: drop-shadow(3px 3px 0 var(--p5-red));
  animation: bob 2.2s ease-in-out infinite;
}
@keyframes bob { 50% { transform: translateY(-6px) rotate(-8deg); } }

/* ══════════════════════════════════════════════════════════════════════════
   8. PANTALLA DE RESULTADOS, DESGLOSE DE COMPATIBILIDAD Y TARJETA PNG
   ══════════════════════════════════════════════════════════════════════════ */
.res-header-grid {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 14px; margin-bottom: 10px;
  border-bottom: 3px solid var(--p5-red); padding-bottom: 10px;
}
#pct {
  font: italic 900 clamp(62px, 13vw, 108px)/.95 var(--p5-font-display);
  color: #fff;
  -webkit-text-stroke: 2px #000;
  text-shadow: 6px 6px 0 var(--p5-red), 11px 11px 0 #000;
  transform: skewX(-8deg); margin: 0;
}
.res-meta { flex: 1; min-width: 220px; }
.res-player-name {
  font: italic 900 18px var(--p5-font-display);
  color: #fff; background: #000;
  border: 2px solid var(--p5-red);
  display: inline-block; padding: 3px 12px;
  transform: skewX(-10deg); margin-bottom: 6px;
}
.res-rank-title {
  font: italic 900 clamp(18px, 2.8vw, 24px)/1.1 var(--p5-font-display);
  color: var(--p5-red); background: #fff;
  border: 2.5px solid #000;
  padding: 4px 12px; display: inline-block;
  transform: skewX(-8deg);
  box-shadow: 4px 4px 0 var(--p5-red);
}
.ending-banner {
  background: linear-gradient(135deg, #1b0308, #000);
  border: 2.5px solid #fff;
  border-left: 10px solid var(--p5-gold);
  padding: 10px 14px; margin: 10px 0;
  box-shadow: 5px 5px 0 var(--p5-red);
}
.ending-banner .ending-tag {
  display: inline-block; background: var(--p5-gold); color: #000;
  font: italic 900 11.5px var(--p5-font-display);
  padding: 2px 8px; border: 1.5px solid #000;
  transform: skewX(-10deg); margin-bottom: 4px;
}
.ending-banner h4 {
  margin: 2px 0 4px;
  font: italic 900 18px var(--p5-font-display);
  color: #fff; text-shadow: 2px 2px 0 var(--p5-red);
}

.match-diff-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;
}
.md-box {
  background: rgba(8,8,14,.92);
  border: 2px solid rgba(255,255,255,.75);
  border-top: 5px solid var(--p5-red);
  padding: 10px 13px; font-size: 13.2px;
}
.md-box.diff { border-top-color: #777; }
.md-box h4 {
  margin: 0 0 6px;
  font: italic 900 14px var(--p5-font-display);
  letter-spacing: .05em; text-transform: uppercase;
  color: #fff;
}
.md-box ul { margin: 0; padding-left: 17px; }
.md-box li { margin: 4px 0; }

.stat {
  margin: 7px 0; font: italic 900 12.8px var(--p5-font-display);
  letter-spacing: .06em; text-transform: uppercase;
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline;
}
.stat span { color: #fff; background: var(--p5-red); padding: 0 7px; border: 1.5px solid #fff; font-size: 13px; }
.stat .fx-bar {
  flex: 1 0 100%; height: 10px; background: #161620;
  border: 2px solid #fff; margin-top: 4px; transform: skewX(-14deg);
}
.fx-bar > i { background: linear-gradient(90deg, var(--p5-red), #fff); }

.trait-badges { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0; }
.trait-badge {
  background: #000; color: #fff;
  border: 2px solid var(--p5-red);
  padding: 3px 10px;
  font: italic 900 11.5px var(--p5-font-display);
  letter-spacing: .06em;
  transform: skewX(-10deg);
  box-shadow: 3px 3px 0 var(--p5-red);
}
.verdict-box {
  background: rgba(230,0,18,.15);
  border: 2px solid #fff;
  border-left: 7px solid var(--p5-red);
  padding: 11px 14px;
  margin: 10px 0;
  font-size: 14px;
  box-shadow: 4px 4px 0 #000;
}
.verdict-box b {
  color: #fff; background: var(--p5-red);
  padding: 1px 7px;
  font-family: var(--p5-font-display);
  letter-spacing: .05em;
}
.ev-log-box {
  background: rgba(0,0,0,.82);
  border: 2px solid rgba(255,255,255,.5);
  border-left: 6px solid var(--p5-gold);
  padding: 9px 12px;
  margin-top: 10px;
  font-size: 13px;
}
.ev-log-box h4 {
  margin: 0 0 6px;
  font: italic 900 13.5px var(--p5-font-display);
  color: var(--p5-gold);
  letter-spacing: .06em;
}
.ev-log-item {
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px; padding: 4px 0;
  border-bottom: 1px dashed rgba(255,255,255,.18);
}
.ev-log-item:last-child { border-bottom: none; }
.ev-delta {
  font: italic 900 11.5px var(--p5-font-display);
  color: #fff; background: var(--p5-red);
  border: 1px solid #fff;
  padding: 1px 7px; transform: skewX(-10deg);
  white-space: nowrap;
}

/* ══════════════════════════════════════════════════════════════════════════
   9. HALL OF FAME — LOS MÁS COMPATIBLES (ESTÉTICA ARCADE P5 ROJO/NEGRO/BLANCO)
   ══════════════════════════════════════════════════════════════════════════ */
.hof-table-wrap {
  width: 100%; overflow-x: auto; margin: 12px 0;
  border: 3px solid #fff;
  background: #07070c;
  box-shadow: 6px 6px 0 var(--p5-red), 11px 11px 0 #000;
}
.hof-table {
  width: 100%; border-collapse: collapse; min-width: 540px;
  font-size: 14px;
}
.hof-table th {
  background: var(--p5-red); color: #fff;
  font: italic 900 13px var(--p5-font-display);
  letter-spacing: .08em; text-transform: uppercase;
  padding: 10px 12px; text-align: left;
  border-bottom: 3px solid #fff;
}
.hof-table td {
  padding: 10px 12px;
  border-bottom: 1.5px solid rgba(255,255,255,.16);
  font-weight: 700;
}
.hof-row {
  background: rgba(14,14,22,.9);
  transition: transform .15s, background-color .15s;
}
.hof-row:hover {
  background: rgba(230,0,18,.22);
}
/* Puesto #1 Exclusivo con Corona y Animación */
.hof-row.rank-1 {
  background: linear-gradient(90deg, rgba(230,0,18,.48) 0%, rgba(255,212,0,.22) 55%, rgba(10,10,16,.95) 100%);
  border-left: 8px solid var(--p5-gold);
  border-top: 2px solid var(--p5-gold);
  border-bottom: 2px solid var(--p5-gold);
  animation: rank1Glow 2.4s ease-in-out infinite alternate;
}
@keyframes rank1Glow {
  from { box-shadow: inset 0 0 12px rgba(255,212,0,.25); }
  to { box-shadow: inset 0 0 26px rgba(230,0,18,.65); }
}
.hof-row.rank-2 {
  background: linear-gradient(90deg, rgba(255,255,255,.18) 0%, rgba(14,14,22,.95) 80%);
  border-left: 6px solid #e0e6ed;
}
.hof-row.rank-3 {
  background: linear-gradient(90deg, rgba(230,0,18,.25) 0%, rgba(14,14,22,.95) 80%);
  border-left: 6px solid #ff7b54;
}
.hof-row.is-current {
  outline: 2.5px solid #fff;
  background: rgba(230,0,18,.34);
}
.rank-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 44px; padding: 3px 8px;
  font: italic 900 14px var(--p5-font-display);
  background: #000; color: #fff;
  border: 2px solid #fff; transform: skewX(-10deg);
}
.rank-1 .rank-badge {
  background: var(--p5-gold); color: #000;
  border-color: #000; font-size: 15.5px;
  box-shadow: 3px 3px 0 var(--p5-red);
}
.rank-2 .rank-badge { background: #fff; color: #000; border-color: var(--p5-red); }
.rank-3 .rank-badge { background: var(--p5-red); color: #fff; border-color: #fff; }

.crown-anim {
  display: inline-block; margin-right: 4px;
  animation: crownFloat 1.6s ease-in-out infinite alternate;
}
@keyframes crownFloat {
  from { transform: translateY(0) rotate(-6deg) scale(1); }
  to { transform: translateY(-4px) rotate(6deg) scale(1.15); }
}
.hof-pct {
  font: italic 900 18px var(--p5-font-display);
  color: #fff; text-shadow: 2px 2px 0 var(--p5-red);
}
.rank-1 .hof-pct { color: var(--p5-gold); font-size: 21px; }
.you-pill {
  display: inline-block; margin-left: 6px;
  background: #fff; color: #000;
  font: italic 900 10.5px var(--p5-font-display);
  padding: 1px 6px; border: 1.5px solid var(--p5-red);
  transform: skewX(-10deg);
}
.hof-empty {
  padding: 28px 18px; text-align: center;
  background: rgba(10,10,16,.9);
  border: 2px dashed rgba(255,255,255,.45);
  margin: 12px 0;
}

/* ══════════════════════════════════════════════════════════════════════════
   10. DOSSIER CARDS, CARTA Y MODALES (MIS_GUSTOS, PNG SHARE, EVENTOS)
   ══════════════════════════════════════════════════════════════════════════ */
.cards {
  display: grid; grid-template-columns: 1fr 1fr;
  width: min(650px, 100%); align-items: start; gap: 11px;
}
.card {
  background: linear-gradient(135deg, rgba(8,8,16,.96), rgba(24,4,12,.9));
  border: 2.5px solid #fff; border-top: 6px solid var(--p5-red);
  padding: 13px 15px; box-shadow: 5px 5px 0 var(--p5-red), 9px 9px 0 #000;
}
.card.blue { grid-column: 1 / -1; border-top-color: #fff; box-shadow: 5px 5px 0 var(--p5-red), 9px 9px 0 #000; }
.card h3 { margin: 0 0 6px; font: italic 900 16px var(--p5-font-display); }
.card ul { margin: 0; padding-left: 18px; }

.duo {
  display: flex; flex-wrap: wrap; gap: 16px;
  align-items: flex-end; justify-content: space-between;
  width: min(1080px, 100%);
}
.duo .paper { width: min(580px, 100%); max-height: 62vh; overflow: auto; }
.duo .panel.side { width: min(410px, 100%); }
.paper {
  background: #f8dfe4; color: #2b0b13; padding: 22px 24px;
  border: 3.5px solid #000; border-top: 9px solid var(--p5-red);
  transform: rotate(-1deg);
  font: italic 600 16px/1.48 'Segoe Script', 'Bradley Hand', Georgia, serif;
  white-space: pre-line; box-shadow: 7px 7px 0 var(--p5-red), 12px 12px 0 #000;
}
.sign { text-align: right; margin-top: 10px; font-weight: 900; color: var(--p5-red); }

#toast {
  position: fixed; left: 50%; top: 62px;
  transform: translate(-50%, -30px) skewX(-10deg);
  background: #fff; color: #000;
  padding: 9px 18px; font: italic 900 13.5px var(--p5-font-display);
  z-index: 10000; opacity: 0; pointer-events: none; transition: .35s;
  max-width: 92vw; text-align: center;
  border: 3px solid var(--p5-red); box-shadow: 5px 5px 0 var(--p5-red), 9px 9px 0 #000;
}
#toast.show { opacity: 1; transform: translate(-50%, 0) skewX(-10deg); }

dialog {
  background: linear-gradient(135deg, #07070c, #1e0309);
  color: #fff; border: 3.5px solid #fff; border-left: 11px solid var(--p5-red);
  max-width: min(640px, 94vw); width: 100%; max-height: 88vh; overflow-y: auto;
  padding: 20px 22px;
  box-shadow: 9px 9px 0 var(--p5-red), 16px 16px 0 #000;
}
dialog::backdrop { background: rgba(0,0,0,.84); backdrop-filter: blur(4px); }
dialog label {
  display: flex; justify-content: space-between; align-items: center;
  margin: 10px 0; font-weight: 700; gap: 10px;
}
.lock { opacity: .42; }

.gustos-grid {
  display: grid; grid-template-columns: 1fr; gap: 8px; margin: 10px 0;
}
.gusto-item {
  background: rgba(0,0,0,.72);
  border: 1.5px solid rgba(255,255,255,.55);
  border-left: 6px solid var(--p5-red);
  padding: 8px 12px;
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
}
.gusto-item b { font-size: 13.5px; color: #fff; }
.gusto-item small { display: block; opacity: .82; font-size: 12px; }

.share-canvas-wrap {
  text-align: center; margin: 10px 0;
  background: #000; border: 2.5px solid #fff; padding: 8px;
}
.share-canvas-wrap canvas {
  max-width: 100%; height: auto; max-height: 52vh;
  border: 2px solid var(--p5-red);
}

#ev-modal {
  position: fixed; inset: 0; z-index: 9990;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  background: radial-gradient(circle at center, rgba(230,0,18,.42) 0%, rgba(0,0,0,.93) 78%);
  backdrop-filter: blur(6px);
  animation: evBackdropIn .3s ease-out both;
}
#ev-modal[hidden] { display: none !important; }

.ev-card {
  position: relative;
  width: min(590px, 96vw);
  background: linear-gradient(135deg, #07070c 0%, #24040d 100%);
  border: 4px solid #fff;
  border-left: 14px solid var(--p5-red);
  padding: 22px 24px;
  transform: skewX(-4deg);
  box-shadow: 10px 10px 0 var(--p5-red), 18px 18px 0 #000, 0 24px 60px rgba(0,0,0,.95);
  animation: evCardPop .46s cubic-bezier(.18,1.15,.32,1) both;
}
.ev-card::before {
  content: "★ PHANTOM SURPRISE INTERCEPT ★";
  position: absolute; top: -15px; left: 18px;
  background: #fff; color: #000;
  border: 2.5px solid #000;
  padding: 2px 12px;
  font: italic 900 12px var(--p5-font-display);
  letter-spacing: .1em;
  transform: skewX(-12deg);
  box-shadow: 4px 4px 0 var(--p5-red);
}
.ev-head { display: flex; align-items: center; gap: 12px; margin: 6px 0 10px; }
.ev-icon { font-size: 38px; filter: drop-shadow(3px 3px 0 var(--p5-red)); animation: bob 1.8s ease-in-out infinite; }
.ev-title {
  margin: 0;
  font: italic 900 clamp(21px, 3.6vw, 28px)/1.05 var(--p5-font-display);
  text-transform: uppercase; color: #fff;
  text-shadow: 3px 3px 0 var(--p5-red), 6px 6px 0 #000;
}
.ev-type-badge {
  display: inline-block;
  background: var(--p5-red); color: #fff;
  border: 1.5px solid #fff;
  padding: 2px 9px; margin-bottom: 4px;
  font: italic 900 11px var(--p5-font-display);
  letter-spacing: .08em; transform: skewX(-10deg);
}
.ev-desc { font-size: 15.5px; font-weight: 700; line-height: 1.45; margin: 10px 0 14px; color: #f4f4f8; }
.ev-outcome {
  background: rgba(230,0,18,.18);
  border: 2px solid #fff;
  border-left: 7px solid var(--p5-gold);
  padding: 12px 14px; margin: 12px 0;
  font-weight: 800; animation: fxPop .35s ease-out both;
}
.ev-bonus-pill {
  display: inline-block; margin-top: 8px;
  background: #fff; color: #000;
  border: 2px solid var(--p5-red);
  padding: 3px 11px;
  font: italic 900 12.5px var(--p5-font-display);
  transform: skewX(-10deg);
  box-shadow: 3px 3px 0 #000;
}

@keyframes evBackdropIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes evCardPop {
  0% { opacity: 0; transform: scale(.72) rotate(-6deg) skewX(-12deg); }
  70% { opacity: 1; transform: scale(1.03) rotate(1deg) skewX(-4deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg) skewX(-4deg); }
}

body.p5-shake { animation: p5Shake .26s ease-out; }
@keyframes p5Shake {
  25% { transform: translate(-4px, 3px); }
  50% { transform: translate(4px, -3px); }
  75% { transform: translate(-2px, -2px); }
}

/* Accesibilidad: prefers-reduced-motion + modo reducido manual */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
html.fx-reduced *, html.fx-reduced *::before, html.fx-reduced *::after { animation: none !important; transition: none !important; }
html.fx-paused #p5-subway-stage *, html.fx-paused .cuca { animation-play-state: paused !important; }

@media (max-width: 760px) {
  .char-standee { opacity: .34; width: 74vw !important; right: -10% !important; left: auto !important; }
  #app[data-pos] #view { align-items: stretch; justify-content: flex-end; padding: 8px 12px 16px; }
  #app[data-pos] .qbox, #app[data-pos] .obox, #app[data-pos] .panel,
  .cards, .duo .paper, .duo .panel.side { width: 100%; }
  #app[data-pos=c] .qbox { margin-bottom: 0; text-align: left; }
  #app[data-pos=c] .qtop { justify-content: flex-start; }
  #app[data-pos=c] .obox { display: block; border-left: 8px solid var(--p5-red); }
  #app[data-pos=r] .obox { border-right: 2.5px solid #fff; border-left: 8px solid var(--p5-red); }
  #app[data-pos=r] .qbox { border-right-width: 3.5px; border-left: 12px solid var(--p5-red); }
  #app[data-pos=m] .rob { position: static; }

/* ══════════════════════════════════════════════════════════════════════════
   A. SANITIZACIÓN XSS Y UTILIDADES DE SEGURIDAD
   ══════════════════════════════════════════════════════════════════════════ */
function escapeHTML(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function sanitizePlayerName(raw) {
  const cleaned = String(raw ?? '')
    .replace(/[\u0000-\u001F\u007F<>]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  return cleaned.slice(0, 20);
}

/* ══════════════════════════════════════════════════════════════════════════
   B. MOTOR DE AUDIO WEB AUDIO API (SFX + ACID JAZZ BGM SIN AUTOPLAY FORZADO)
   ══════════════════════════════════════════════════════════════════════════ */
const P5Audio = (() => {
  let ctx = null, masterGain = null, bgmTimer = null, step = 0;
  const state = { enabled: true, bgm: true, volume: 0.65, unlocked: false };

  try {
    const saved = JSON.parse(localStorage.getItem('six_p5_audio') || '{}');
    if (typeof saved.enabled === 'boolean') state.enabled = saved.enabled;
    if (typeof saved.bgm === 'boolean') state.bgm = saved.bgm;
    if (typeof saved.volume === 'number') state.volume = saved.volume;
  } catch (_) {}

  function saveState() {
    try { localStorage.setItem('six_p5_audio', JSON.stringify(state)); } catch (_) {}
    updateQuickBtn();
  }

  function ensureCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      masterGain = ctx.createGain();
      masterGain.gain.value = state.enabled ? state.volume : 0;
      masterGain.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    state.unlocked = true;
    return ctx;
  }

  function playTone(freq, type, duration, vol = 0.24, slideTo = null, delay = 0) {
    if (!state.enabled || !state.unlocked) return;
    const c = ensureCtx();
    if (!c) return;
    const now = c.currentTime + delay;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + duration);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(g); g.connect(masterGain);
    osc.start(now); osc.stop(now + duration + 0.02);
  }

  function playNoise(duration = 0.16, vol = 0.18, highpass = 900) {
    if (!state.enabled || !state.unlocked) return;
    const c = ensureCtx();
    if (!c) return;
    const len = Math.floor(c.sampleRate * duration);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.5);
    const src = c.createBufferSource();
    src.buffer = buf;
    const flt = c.createBiquadFilter();
    flt.type = 'highpass'; flt.frequency.value = highpass;
    const g = c.createGain(); g.gain.value = vol;
    src.connect(flt); flt.connect(g); g.connect(masterGain);
    src.start();
  }

  const sfx = {
    hover() { if (state.unlocked) playTone(1380, 'triangle', 0.04, 0.07, 1820); },
    select() {
      ensureCtx();
      playNoise(0.055, 0.14, 1800);
      playTone(523.25, 'sawtooth', 0.085, 0.16, 783.99, 0);
      playTone(1046.5, 'square', 0.12, 0.12, 1318.5, 0.03);
    },
    slash() {
      if (!state.unlocked) return;
      playNoise(0.28, 0.24, 420);
      playTone(170, 'sawtooth', 0.25, 0.22, 46, 0);
      playTone(920, 'triangle', 0.19, 0.14, 240, 0.05);
    },
    cutin() {
      if (!state.unlocked) return;
      playNoise(0.22, 0.22, 1200);
      playTone(740, 'sawtooth', 0.14, 0.18, 1480, 0);
      playTone(1480, 'square', 0.18, 0.14, 880, 0.08);
    },
    event() {
      if (!state.unlocked) return;
      playNoise(0.18, 0.2, 1000);
      [587.33, 880, 1174.66].forEach((f, i) => playTone(f, 'sawtooth', 0.16, 0.16, null, i * 0.055));
    },
    reveal() {
      if (!state.unlocked) return;
      [440, 554.37, 659.25, 880, 1108.73].forEach((f, i) => playTone(f, 'triangle', 0.22, 0.16, null, i * 0.07));
    },
    toast() {
      if (!state.unlocked) return;
      [523.25, 659.25, 783.99, 1046.5].forEach((n, i) => playTone(n, 'triangle', 0.17, 0.15, null, i * 0.055));
    },
    roberto() {
      ensureCtx();
      playTone(700, 'sine', 0.055, 0.1, 950, 0);
      playTone(860, 'triangle', 0.065, 0.1, 640, 0.06);
    }
  };

  const bass = [130.81, 130.81, 155.56, 174.61, 196.00, 174.61, 155.56, 116.54];
  const chords = [
    [261.63, 311.13, 392.00, 466.16, 587.33],
    [261.63, 349.23, 415.30, 523.25, 622.25],
    [293.66, 349.23, 415.30, 523.25],
    [246.94, 311.13, 392.00, 466.16]
  ];

  function startBgm() {
    if (bgmTimer) return;
    bgmTimer = setInterval(() => {
      if (!state.enabled || !state.bgm || !state.unlocked || document.hidden) return;
      const b = bass[step % bass.length];
      playTone(b / 2, 'triangle', 0.25, 0.075, b / 2.02);
      if (step % 4 === 0) {
        const ch = chords[Math.floor(step / 4) % chords.length];
        ch.forEach((f, idx) => playTone(f, 'sine', 0.6, 0.022, null, idx * 0.015));
      }
      if (step % 2 === 1) playNoise(0.022, 0.03, 5500);
      step++;
    }, 330);
  }

  function updateQuickBtn() {
    const btn = document.getElementById('btn-audio-quick');
    if (!btn) return;
    btn.textContent = state.enabled ? '🔊 AUDIO' : '🔇 MUTE';
    btn.classList.toggle('off', !state.enabled);
  }

  function setEnabled(v) {
    state.enabled = !!v; ensureCtx();
    if (masterGain && ctx) masterGain.gain.setValueAtTime(state.enabled ? state.volume : 0, ctx.currentTime);
    if (state.enabled) startBgm();
    saveState();
  }
  function setBgm(v) { state.bgm = !!v; if (state.bgm) startBgm(); saveState(); }
  function setVolume(v) {
    state.volume = Math.max(0, Math.min(1, parseFloat(v) || 0)); ensureCtx();
    if (masterGain && ctx && state.enabled) masterGain.gain.setValueAtTime(state.volume, ctx.currentTime);
    saveState();
  }

  return { state, sfx, setEnabled, setBgm, setVolume, ensureCtx, startBgm, updateQuickBtn };
})();

/* ══════════════════════════════════════════════════════════════════════════
   D. CANVAS DE ESTRELLAS, CORAZONES Y CARTAS PHANTOM + PARALAJE
   ══════════════════════════════════════════════════════════════════════════ */
(() => {
  const canvas = document.getElementById('p5-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let w = 0, h = 0, mx = 0, my = 0;

  const particles = Array.from({ length: 18 }, (_, i) => ({
    x: Math.random(), y: Math.random(),
    r: 8 + Math.random() * 16,
    rot: Math.random() * Math.PI * 2,
    vRot: (Math.random() - 0.5) * 0.015,
    vy: -0.00028 - Math.random() * 0.0004,
    kind: i % 3 === 0 ? 'heart' : (i % 3 === 1 ? 'card' : 'star'),
    color: i % 2 === 0 ? '#e60012' : '#ffffff',
    alpha: 0.16 + Math.random() * 0.24
  }));

  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  window.addEventListener('pointermove', e => {
    mx = (e.clientX / Math.max(1, w) - 0.5) * 2;
    my = (e.clientY / Math.max(1, h) - 0.5) * 2;
    document.documentElement.style.setProperty('--px', mx.toFixed(3));
    document.documentElement.style.setProperty('--py', my.toFixed(3));
  }, { passive: true });

  function drawParticle(p, cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.8;

    if (p.kind === 'star') {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? p.r : p.r * 0.42;
        const a = (i * Math.PI) / 5;
        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    } else if (p.kind === 'card') {
      const cw = p.r * 1.1, ch = p.r * 1.55;
      ctx.fillRect(-cw / 2, -ch / 2, cw, ch);
      ctx.strokeRect(-cw / 2, -ch / 2, cw, ch);
    } else {
      const s = p.r * 0.06;
      ctx.beginPath();
      ctx.moveTo(0, 4 * s);
      ctx.bezierCurveTo(0, s, -10 * s, -6 * s, -10 * s, 2 * s);
      ctx.bezierCurveTo(-10 * s, 9 * s, 0, 13 * s, 0, 17 * s);
      ctx.bezierCurveTo(0, 13 * s, 10 * s, 9 * s, 10 * s, 2 * s);
      ctx.bezierCurveTo(10 * s, -6 * s, 0, s, 0, 4 * s);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  function tick() {
    const html = document.documentElement;
    if (!html.classList.contains('fx-reduced') && !html.classList.contains('fx-paused')) {
      ctx.clearRect(0, 0, w, h);
      for (const p of particles) {
        p.y += p.vy; p.rot += p.vRot;
        if (p.y < -0.08) { p.y = 1.08; p.x = Math.random(); }
        drawParticle(p, p.x * w + mx * -14, p.y * h + my * -10);
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* ══════════════════════════════════════════════════════════════════════════
   E. GESTOR DE ESCENARIO Y CARGADOR DE GIF PERSONALIZADO
   ══════════════════════════════════════════════════════════════════════════ */
const FXStage = (() => {
  const host = document.getElementById('app');
  let stage = host.querySelector('.fx-stage');
  if (!stage) {
    stage = document.createElement('div');
    stage.className = 'fx-stage';
    host.prepend(stage);
  }
  let customBgUrl = '';
  try { customBgUrl = localStorage.getItem('six_custom_gif') || ''; } catch (_) {}

  function applyCustomBg(url) {
    customBgUrl = url || '';
    try {
      if (customBgUrl) localStorage.setItem('six_custom_gif', customBgUrl);
      else localStorage.removeItem('six_custom_gif');
    } catch (_) {}
    const subway = document.getElementById('p5-subway-stage');
    if (customBgUrl) {
      stage.innerHTML = `<div class="fx-layer fx-m-kenburns"><img src="${escapeHTML(customBgUrl)}" alt="Custom Background"></div>`;
      if (subway) subway.style.opacity = '0.25';
    } else {
      stage.innerHTML = '';
      if (subway) subway.style.opacity = '1';
    }
  }

  if (customBgUrl) applyCustomBg(customBgUrl);

  function slash() {
    P5Audio.sfx.slash();
    if (document.documentElement.classList.contains('fx-reduced')) return;
    document.body.classList.remove('p5-shake');
    void document.body.offsetWidth;
    document.body.classList.add('p5-shake');

    const el = document.createElement('div');
    el.className = 'fx-slash';
    el.innerHTML = '<i></i><i></i><i></i>';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 760);
  }

  function burst(x, y, count = 8) {
    if (document.documentElement.classList.contains('fx-reduced')) return;
    const glyphs = ['★', '✦', '❤', '🃏'];
    for (let i = 0; i < count; i++) {
      const p = document.createElement('span');
      p.className = 'fx-p';
      p.textContent = glyphs[i % glyphs.length];
      const angle = (Math.PI * 2 * i) / count;
      const dist = 35 + Math.random() * 65;
      p.style.left = `${x}px`; p.style.top = `${y}px`;
      p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
      p.style.setProperty('--dy', `${Math.sin(angle) * dist - 18}px`);
      p.style.setProperty('--r', `${Math.round((Math.random() - 0.5) * 180)}deg`);
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 920);
    }
  }

  return { slash, burst, applyCustomBg, getCustomBg: () => customBgUrl };
})();

/* ══════════════════════════════════════════════════════════════════════════
   G. HALL OF FAME (LOCALSTORAGE) + ARQUITECTURA DE RANKING COMPARTIDO ONLINE
   ══════════════════════════════════════════════════════════════════════════ */
const HallOfFameManager = (() => {
  const STORAGE_KEY = 'six_seven_hall_of_fame_v2';
  const ONLINE_CFG_KEY = 'six_seven_online_cfg_v1';

  let entries = [];
  let onlineConfig = {
    endpointUrl: '',
    enabled: false
  };

  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) entries = parsed;
    }
  } catch (_) {}

  try {
    const rawCfg = localStorage.getItem(ONLINE_CFG_KEY);
    if (rawCfg) {
      const parsedCfg = JSON.parse(rawCfg);
      if (parsedCfg && typeof parsedCfg.endpointUrl === 'string') {
        onlineConfig.endpointUrl = parsedCfg.endpointUrl.trim();
        onlineConfig.enabled = !!parsedCfg.enabled && !!onlineConfig.endpointUrl;
      }
    }
  } catch (_) {}

  function saveLocal() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch (_) {}
  }

  function saveOnlineCfg(url, enabled) {
    onlineConfig.endpointUrl = String(url || '').trim();
    onlineConfig.enabled = !!enabled && !!onlineConfig.endpointUrl;
    try { localStorage.setItem(ONLINE_CFG_KEY, JSON.stringify(onlineConfig)); } catch (_) {}
  }

  /* Ordena de mayor a menor porcentaje; en caso de empate, prioriza el más antiguo */
  function sortEntries(list) {
    return [...list].sort((a, b) => {
      if (b.pct !== a.pct) return b.pct - a.pct;
      return (a.timestamp || 0) - (b.timestamp || 0);
    });
  }

  function getTop10() {
    return sortEntries(entries).slice(0, 10);
  }

  function getAllSorted() {
    return sortEntries(entries);
  }

  /* Registra una partida completada sin duplicar por matchId */
  function recordCompletedMatch(record) {
    if (!record || !record.matchId || !record.completedAll10) return null;
    const safeName = sanitizePlayerName(record.name);
    if (!safeName) return null;

    const existingIdx = entries.findIndex(e => e.matchId === record.matchId);
    if (existingIdx !== -1) {
      return entries[existingIdx];
    }

    const now = typeof record.timestamp === 'number' ? record.timestamp : Date.now();
    const d = new Date(now);
    const formattedDate = d.toLocaleDateString('es-ES', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });

    const newEntry = {
      matchId: String(record.matchId),
      name: safeName,
      pct: Math.max(1, Math.min(100, Math.round(Number(record.pct) || 1))),
      timestamp: now,
      dateStr: record.dateStr || formattedDate,
      routeTitle: String(record.routeTitle || 'Ruta Confidant'),
      endingId: String(record.endingId || 'confidant')
    };

    entries.push(newEntry);
    saveLocal();

    if (onlineConfig.enabled && onlineConfig.endpointUrl) {
      syncToOnlineBackend(newEntry, record.auditPayload).catch(() => {});
    }

    return newEntry;
  }

  /* Cliente para Backend Online Compartido (Envía respuestas para recálculo en servidor) */
  async function syncToOnlineBackend(entry, auditPayload) {
    if (!onlineConfig.enabled || !onlineConfig.endpointUrl) return null;
    const payload = {
      matchId: entry.matchId,
      playerName: entry.name,
      clientReportedPct: entry.pct,
      routeTitle: entry.routeTitle,
      endingId: entry.endingId,
      timestamp: entry.timestamp,
      /* El servidor recalcula el % usando questionIds + selectedOptionIds */
      verification: auditPayload || {}
    };
    const res = await fetch(onlineConfig.endpointUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('Error sincronizando con backend');
    return await res.json();
  }

  async function fetchOnlineLeaderboard() {
    if (!onlineConfig.enabled || !onlineConfig.endpointUrl) return null;
    const res = await fetch(onlineConfig.endpointUrl, { method: 'GET' });
    if (!res.ok) throw new Error('No se pudo leer el ranking remoto');
    const data = await res.json();
    if (Array.isArray(data.leaderboard)) {
      return sortEntries(data.leaderboard).slice(0, 10);
    }
    return null;
  }

  return {
    getTop10,
    getAllSorted,
    recordCompletedMatch,
    getOnlineCfg: () => ({ ...onlineConfig }),
    saveOnlineCfg,
    fetchOnlineLeaderboard
  };
})();

/* ══════════════════════════════════════════════════════════════════════════
   K. MOTOR PRINCIPAL DEL JUEGO Y ALGORITMO REAL DE COMPATIBILIDAD (1%–100%)
   ══════════════════════════════════════════════════════════════════════════ */
(() => {
  const app = document.getElementById('app');

  const QUESTIONS_PER_MATCH = 10;

  const EVENT_CONFIG = {
    chancePerStep: 0.35,
    maxEventsPerMatch: 3,
    allowRepeatEvents: false
  };

  try {
    const savedChance = parseFloat(localStorage.getItem('six_ev_chance'));
    if (!Number.isNaN(savedChance)) EVENT_CONFIG.chancePerStep = Math.max(0, Math.min(1, savedChance));
  } catch (_) {}

  const ARCHIVE_ITEMS = [
    { id: 'intro', title: '01 // Estación Shibuya', desc: 'Te identificaste como Ladrón de Corazones en el andén.' },
    { id: 'ev_rob', title: '02 // Eventos Sorpresa del Andén', desc: 'Viviste un evento inesperado durante la partida.' },
    { id: 'stats', title: '03 // Escaneo de Futaba (1%–100%)', desc: 'Futaba calculó tu compatibilidad real con MIS_GUSTOS.' },
    { id: 'cards', title: '04 // Dossier Confidant', desc: 'Desbloqueaste el expediente de pareja y final.' },
    { id: 'letter', title: '05 // Calling Card de Joker', desc: 'Leíste la carta personalizada y sellaste el pacto.' }
  ];

  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  let savedPlayerName = '';
  try { savedPlayerName = sanitizePlayerName(localStorage.getItem('six_last_player_name') || ''); } catch (_) {}

  const state = {

    playerName: savedPlayerName,
    matchId: '',
    recordedInHof: false,
    qIdx: 0,
    matchQuestions: [],
    answers: [],
    triggeredEvents: [],
    usedEventIds: new Set(),
    rolledStepKeys: new Set(),
    vibeBonus: 0,
    activeEvent: null,
    unlocked: new Set(['intro'])
  };

  try {
    const savedU = JSON.parse(localStorage.getItem('six_unlocked') || '["intro"]');
    savedU.forEach(x => state.unlocked.add(x));
  } catch (_) {}

  function createMatchId() {
    return 'm_' + Date.now().toString(36) + '_' + Math.floor(Math.random() * 1e6).toString(36);
  }

  function startNewMatch(preserveName = true) {
    if (!preserveName) state.playerName = '';
    const shuffledPool = shuffleArray(QUESTION_BANK);
    const picked = shuffledPool.slice(0, QUESTIONS_PER_MATCH).map(q => ({

    }));

    state.matchId = createMatchId();
    state.recordedInHof = false;
    state.matchQuestions = picked;

    state.usedEventIds = new Set();
    state.rolledStepKeys = new Set();
    state.vibeBonus = 0;

  }

  startNewMatch(true);

  function updateHudPlayerTag() {

  }

  function unlock(id, msg) {

  let toastTimer = null;

  }

  /* ════════════════════════════════════════════════════════════════════════
     ALGORITMO DETERMINISTA REAL 1%–100% (SIN MATH.RANDOM EN EL CÁLCULO)
     ════════════════════════════════════════════════════════════════════════ */
  function calcStats() {
    let earnedWeighted = 0;
    let maxWeighted = 0;
    let minWeighted = 0;
    let valueClashes = 0;
    let answeredCount = 0;

    const sharedTastes = [];
    const mainDifferences = [];
    const routeCounts = { enemies: 0, drarry: 0, kdrama: 0, soulmate: 0, chaos: 0, mystery: 0 };

    const catMap = {
      anime: { label: '🎬 Anime, Drarry & K-Dramas', earned: 0, max: 0 },
      romance: { label: '❤️ Romance, Confianza & Afecto', earned: 0, max: 0 },
      animales: { label: '🐾 Gatos, Perros & Empatía Animal', earned: 0, max: 0 },
      comida: { label: '🦐 Gastronomía & Mariscos', earned: 0, max: 0 },
      intereses: { label: '🏛️ Razonamiento Verbal, Historia & Misterio', earned: 0, max: 0 },
      estetica: { label: '🃏 Estética Persona 5 & Humor', earned: 0, max: 0 }
    };

    let synRaw = 0, humRaw = 0, caosRaw = 0, lealRaw = 0;

    state.matchQuestions.forEach((q, idx) => {
      const ansIdx = state.answers[idx];
      const profileMult = MisGustosManager.getMultiplier(q.tasteKey);
      const effectiveW = (q.weight || 1.0) * profileMult;

      const scores = q.opts.map(o => typeof o.score === 'number' ? o.score : 0.5);
      const qMax = Math.max(...scores);
      const qMin = Math.min(...scores);

      maxWeighted += effectiveW * qMax;
      minWeighted += effectiveW * qMin;

      const pick = ansIdx !== null && ansIdx !== undefined ? q.opts[ansIdx] : null;
      const chosenScore = pick ? (typeof pick.score === 'number' ? pick.score : 0.5) : 0;

      if (pick) {
        answeredCount++;
        earnedWeighted += effectiveW * chosenScore;

        if (pick.isValueClash) valueClashes++;
        if (pick.sharedFact && chosenScore >= 0.8) sharedTastes.push(pick.sharedFact);
        if (pick.diffFact && chosenScore <= 0.55) mainDifferences.push(pick.diffFact);

        if (Array.isArray(pick.routeTags)) {
          pick.routeTags.forEach(tag => {
            if (routeCounts[tag] !== undefined) routeCounts[tag]++;
          });
        }

        synRaw += (pick.pts?.syn || 5);
        humRaw += (pick.pts?.hum || 5);
        caosRaw += (pick.pts?.caos || 5);
        lealRaw += (pick.pts?.leal || 5);
      }

      const cKey = catMap[q.catId] ? q.catId : 'estetica';
      catMap[cKey].earned += effectiveW * chosenScore;
      catMap[cKey].max += effectiveW * qMax;
    });

    const span = Math.max(0.0001, maxWeighted - minWeighted);
    let normRatio = (earnedWeighted - minWeighted) / span;
    normRatio = Math.max(0, Math.min(1, normRatio));

    /* Penalización ética si se vulneran valores importantes (maltrato animal, ley del hielo, celos posesivos) */
    if (valueClashes > 0) {
      normRatio = normRatio * Math.pow(0.62, valueClashes);
    }

    /* Mapeo continuo determinista a cualquier entero entre 1% y 100% */
    const total = Math.max(1, Math.min(100, Math.round(1 + 99 * normRatio)));

    /* Categorías ordenadas de mayor a menor compatibilidad */
    const categories = Object.keys(catMap)
      .filter(k => catMap[k].max > 0)
      .map(k => {
        const ratio = catMap[k].earned / catMap[k].max;
        const pctCat = Math.max(1, Math.min(100, Math.round(1 + 99 * ratio)));
        return { id: k, label: catMap[k].label, pct: pctCat };
      })
      .sort((a, b) => b.pct - a.pct);

    const maxStat = Math.max(1, state.matchQuestions.length * 11);
    const scaleStat = raw => Math.max(1, Math.min(100, Math.round(1 + 99 * (raw / maxStat))));
    const syn = scaleStat(synRaw);
    const hum = scaleStat(humRaw);
    const caos = scaleStat(caosRaw);
    const leal = scaleStat(lealRaw);

    /* Selección determinista de Ruta Romántica / Final Desbloqueado */
    let ending = ENDINGS_CATALOG.complices;
    if (total >= 92 && valueClashes === 0) {
      ending = ENDINGS_CATALOG.perfect_match;
    } else if (total >= 65 && (routeCounts.drarry >= 2 || routeCounts.enemies >= 3) && valueClashes === 0) {
      ending = ENDINGS_CATALOG.enemies_to_lovers;
    } else if (total >= 65 && routeCounts.kdrama >= 3 && valueClashes === 0) {
      ending = ENDINGS_CATALOG.kdrama;
    } else if (total >= 80 && valueClashes === 0) {
      ending = ENDINGS_CATALOG.soulmates;
    } else if (total >= 55 && routeCounts.chaos >= 3 && valueClashes === 0) {
      ending = ENDINGS_CATALOG.chaos_absoluto;
    } else if (total < 40 || valueClashes >= 2) {
      ending = ENDINGS_CATALOG.eclipse;
    }

    /* Mensajes personalizados por rango de compatibilidad (1% a 100%) */
    let rankTitle = '';
    let rankMessage = '';
    const pName = state.playerName || 'Ladrón Fantasma';

    if (total >= 95) {
      rankTitle = 'RANGO S+ // VÍNCULO ABSOLUTO SIX & SEVEN';
      rankMessage = `${pName}, tu sintonía con mis gustos y valores es prácticamente perfecta (${total}%). Desde el amor por los mariscos, el anime, Drarry y los K-dramas hasta la empatía por los animales, la Historia Universal y el razonamiento verbal: ¡has robado el Tesoro del Palacio sin activar ni una sola alarma!`;
    } else if (total >= 82) {
      rankTitle = 'RANGO S // CONFIDANT DE ÉLITE EN LLAMAS';
      rankMessage = `${pName}, hemos alcanzado un ${total}% de compatibilidad real. Compartimos los pilares más importantes —confianza, cariño por los gatos y perros, pasión por las grandes historias llenas de misterio y tensión emocional— con el toque justo de chispa propia.`;
    } else if (total >= 68) {
      rankTitle = 'RANGO A // QUÍMICA MAGNÉTICA DE RIVALES A CÓMPLICES';
      rankMessage = `¡Muy buena marca, ${pName} (${total}%)! Coincidimos en gran parte de nuestras pasiones y valores clave, y las pequeñas diferencias prometen debates épicos dignos de un buen Enemies to Lovers con mariscos de por medio.`;
    } else if (total >= 52) {
      rankTitle = 'RANGO B // ALIANZA CURIOSA EN EL EXPRESO';
      rankMessage = `${pName}, con un ${total}% tenemos un punto medio interesante: conectamos en varios temas clave, aunque en otros gustos viajamos en vagones distintos. ¡Hay terreno para descubrirnos paso a paso!`;
    } else if (total >= 35) {
      rankTitle = 'RANGO C // FRECUENCIAS CONTRAPUESTAS';
      rankMessage = `${pName}, tu resultado es ${total}%. Coincidimos en algunos destellos puntuales, pero nuestras preferencias en entretenimiento, comida o ritmo romántico toman rutas bastante diferentes.`;
    } else if (total >= 15) {
      rankTitle = 'RANGO D // DISTANCIA EN EL METAVERSO';
      rankMessage = `${pName}, con un ${total}% queda claro que somos casi polos opuestos en gustos y prioridades. Como diría Futaba: ¡nuestros radares apuntan a galaxias distintas!`;
    } else {
      rankTitle = 'RANGO E // INCOMPATIBILIDAD EXTREMA (SOMBRA REBELDE)';
      rankMessage = `${pName}, ¡un ${total}%! Has esquivado prácticamente todos mis gustos conocidos o chocado con valores esenciales como la empatía animal y la comunicación. ¡Al menos Roberto 🪳 aplaude tu honestidad brutal!`;
    }

    const traits = [];
    if (total >= 90) traits.push('👑 Sincronía Élite');
    if (routeCounts.drarry > 0 || routeCounts.enemies >= 2) traits.push('⚡ Dinámica Drarry / Enemies to Lovers');
    if (routeCounts.kdrama >= 2) traits.push('☔ Protagonista de K-Drama');
    if (routeCounts.mystery >= 2) traits.push('🧩 Mente Verbal & Histórica');
    if (valueClashes === 0 && answeredCount > 0) traits.push('🐾 Empatía Animal & Confianza Sana');
    if (state.triggeredEvents.length > 0) traits.push(`🃏 Eventos Vividos (${state.triggeredEvents.length})`);

    return {
      total, syn, hum, caos, leal,
      answeredCount,
      completedAll10: answeredCount === QUESTIONS_PER_MATCH,
      valueClashes,
      sharedTastes: sharedTastes.length ? sharedTastes.slice(0, 5) : ['Ninguna coincidencia fuerte registrada en esta partida.'],
      mainDifferences: mainDifferences.length ? mainDifferences.slice(0, 5) : ['¡Cero choques importantes! Tus respuestas armonizan con mis gustos y valores.'],
      categories,
      ending,
      rankTitle,
      rankMessage,
      traits
    };
  }

  /* Calcula el pulso visual del Medidor de Química durante el cuestionario sin falsear el % */
  function calcLiveChemistryPulse() {
    let answered = 0;
    let sumScore = 0;
    state.matchQuestions.forEach((q, idx) => {
      const a = state.answers[idx];
      if (a !== null && a !== undefined && q.opts[a]) {
        answered++;
        sumScore += q.opts[a].score;
      }
    });
    if (answered === 0) {
      return { width: 15, label: 'ESPERANDO SEÑAL COGNITIVA...' };
    }
    const avg = sumScore / answered;
    const visualWidth = Math.max(12, Math.min(100, Math.round(avg * 100)));
    let label = 'RESONANCIA ESTABLE';
    if (avg >= 0.88) label = '🔥 CHISPA MÁXIMA DETECTADA';
    else if (avg >= 0.68) label = '⚡ TENSIÓN ROMÁNTICA EN AUMENTO';
    else if (avg >= 0.42) label = '🎭 CONTRASTE DE PERSONALIDADES';
    else label = '❄️ ALERTA DE POLOS OPUESTOS';
    return { width: visualWidth, label };
  }

  /* ════════════════════════════════════════════════════════════════════════
     SISTEMA DE EVENTOS ALEATORIOS (SIN REPETICIÓN EN LA MISMA PARTIDA)
     ════════════════════════════════════════════════════════════════════════ */
  function maybeRollSurpriseEvent(stepIndex) {
    const stepKey = `step_${stepIndex}`;
    if (state.rolledStepKeys.has(stepKey)) return false;
    state.rolledStepKeys.add(stepKey);

    if (state.triggeredEvents.length >= EVENT_CONFIG.maxEventsPerMatch) return false;
    if (Math.random() > EVENT_CONFIG.chancePerStep) return false;

    const available = EVENT_BANK.filter(ev => EVENT_CONFIG.allowRepeatEvents || !state.usedEventIds.has(ev.id));
    if (!available.length) return false;

    const chosen = available[Math.floor(Math.random() * available.length)];
    state.usedEventIds.add(chosen.id);
    openSurpriseEventModal(chosen);
    return true;
  }

    evModal.querySelectorAll('[data-ev-choice]').forEach(btn => {
      btn.addEventListener('click', e => {
        const idx = Number(btn.dataset.evChoice);
        const choice = evObj.choices[idx];

        state.vibeBonus += (choice.vibeDelta || 10);

            </div>
          `;
        }
        if (contBtn) contBtn.hidden = false;
        FXStage.burst(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2, 14);
      });
    });

    document.getElementById('btn-ev-skip')?.addEventListener('click', () => {
      state.triggeredEvents.push({

  function buildShareText(st) {
    return `★ SÉ MI SIX DE MI SEVEN — ULTIMATE PERSONA 5 EDITION ★\n` +
      `🃏 Ladrón de Corazones: ${state.playerName || 'Anónimo'}\n` +

      `🪳 ¡Pacto auditado por Joker, Futaba y Roberto!`;
  }

  async function copyTextFallback(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (_) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (__){}
      ta.remove();
    }
  }

  /* Animación cinematográfica de revelado progresivo del porcentaje */
  function animatePercentageReveal(targetPct) {
    const el = document.getElementById('pct');
    if (!el) return;
    if (document.documentElement.classList.contains('fx-reduced')) {
      el.textContent = `${targetPct}%`;
      return;
    }
    P5Audio.sfx.reveal();
    const duration = 950;
    const start = performance.now();
    function frame(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const cur = Math.max(1, Math.round(eased * targetPct));
      el.textContent = `${cur}%`;
      if (t < 1) requestAnimationFrame(frame);
      else el.textContent = `${targetPct}%`;
    }
    requestAnimationFrame(frame);
  }

    state.screen = nextScreen;
    app.dataset.screen = nextScreen;

    render();
  }
