        <div class="cards fx-in" data-fx-in style="--d:40ms">
          <article class="card">
            <h3>ARCANA // EL SIX (${escapeHTML(state.playerName || 'TÚ')})</h3>
            <ul>
              <li>Compatibilidad demostrada: <b>${st.total}%</b> (${escapeHTML(st.rankTitle)}).</li>
              <li>Ruta desbloqueada: <b>${escapeHTML(st.ending.route)}</b>.</li>
              <li>Especialidad: ${escapeHTML(st.categories[0]?.label || 'Química Romántica')} (${st.categories[0]?.pct || st.total}%).</li>
            </ul>
          </article>
          <article class="card">
            <h3>ARCANA // EL SEVEN (MI PERFIL)</h3>
            <ul>
              <li>Amante del anime, Enemies to Lovers, Harry Potter (Drarry) y los K-dramas.</li>
              <li>Fan condicional de los mariscos, la Historia Universal y el razonamiento verbal.</li>
              <li>Defensor absoluto de los gatos, los perros, la confianza y el cariño sincero.</li>
            </ul>
          </article>
          <article class="card blue">
            <h3>${escapeHTML(st.ending.badge)} // ${escapeHTML(st.ending.title)}</h3>
            <p style="margin:6px 0">${escapeHTML(st.ending.desc)}</p>
            <div class="row">
              <button type="button" class="btn" id="btn-back-stats">← VOLVER AL EXPEDIENTE</button>
              <button type="button" class="btn main" id="btn-to-letter">LEER CALLING CARD FINAL ✉ →</button>
            </div>
          </article>
        </div>
      `;

      document.getElementById('btn-back-stats')?.addEventListener('click', () => go('stats', true));
      document.getElementById('btn-to-letter')?.addEventListener('click', () => {
        triggerP5CutIn('joker', 'TAKE YOUR HEART!');
        unlock('letter', '★ ¡CALLING CARD ENTREGADA!');
        go('letter', true);
      });
      return;
    }

    /* 6. CALLING CARD FINAL PERSONALIZADA */
    if (state.screen === 'letter') {
      app.dataset.pos = 'l';
      setShowcaseCharacter('joker');
      crumb.textContent = 'CALLING CARD // MENSAJE PERSONALIZADO';
      const st = calcStats();
      const pName = state.playerName || 'Ladrón de Corazones';

      let letterBody = '';
      if (st.total >= 68) {
        letterBody = `Para ${pName}:

Desde que cruzamos miradas en este expreso de Shibuya, cada estación ha tenido mejor banda sonora, más tensión de la buena y muchas más risas.

Tras superar las 10 estaciones con un ${st.total}% de compatibilidad y desbloquear el «${st.ending.title}», ha quedado demostrado que compartimos lo esencial: el gusto por las buenas historias llenas de misterio y giros, el cariño por los animales, las ganas de brindar con unos buenos mariscos y la confianza de un equipo real.

Por eso hoy Joker, Futaba, Morgana y Roberto 🪳 me ayudan a entregarte esta Calling Card oficial:
¿Aceptas ser oficialmente el Six de mi Seven?`;
      } else {
        letterBody = `Para ${pName}:

Has recorrido las 10 estaciones del expreso de Shibuya con valentía y sinceridad, alcanzando un ${st.total}% de compatibilidad y desbloqueando «${st.ending.title}».

Aunque tengamos gustos distintos en varias categorías, en el Metaverso se valora la autenticidad por encima de todo. Siempre habrá sitio en el Leblanc para debatir nuestras diferencias con buen humor y respeto.

¡Gracias por aceptar el reto de los Ladrones de Corazones!`;
      }

      view.innerHTML = `
        <div class="duo fx-in" data-fx-in style="--d:50ms">
          <article class="paper">${escapeHTML(letterBody)}
            <div class="sign">— Con todo el estilo Phantom (y Roberto en smoking 🪳)</div>
          </article>
          <aside class="panel side">
            <h2>SELLAR EL EXPEDIENTE</h2>
            <p>Agente: <b>${escapeHTML(pName)}</b></p>
            <p>Compatibilidad Real: <b>${st.total}%</b></p>
            <p style="font-size:13px;opacity:.9">Final: <b>${escapeHTML(st.ending.title)}</b></p>
            <div class="row">
              <button type="button" class="btn main" id="btn-accept-yes">★ ¡SÍ, SELLAR EL PACTO!</button>
              <button type="button" class="btn gold" id="btn-letter-png">📸 TARJETA PNG</button>
              <button type="button" class="btn" id="btn-copy-res">📋 COPIAR VEREDICTO</button>
              <button type="button" class="btn" data-a="hof">👑 HALL OF FAME</button>
              <button type="button" class="btn" id="btn-restart">↻ JUGAR OTRA VEZ</button>
            </div>
          </aside>
        </div>
      `;

      document.getElementById('btn-accept-yes')?.addEventListener('click', e => {
        triggerP5CutIn('futaba', 'CONFIDANT RANK MAX!');
        FXStage.burst(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2, 18);
        showToast(`❤ ¡PACTO SELLADO CON ${pName.toUpperCase()} (${st.total}%)! ❤`);
      });

      document.getElementById('btn-letter-png')?.addEventListener('click', () => openShareCardModal(st));

      document.getElementById('btn-copy-res')?.addEventListener('click', async () => {
        await copyTextFallback(buildShareText(st));
        showToast('★ VEREDICTO COPIADO AL PORTAPAPELES');
      });

      document.getElementById('btn-restart')?.addEventListener('click', () => {
        startNewMatch(true);
        go('intro', true);
      });
    }
  }

  /* ════════════════════════════════════════════════════════════════════════
     MODALES DE SISTEMA: MIS_GUSTOS, RANKING ONLINE, ARCHIVO Y CONFIGURACIÓN
     ════════════════════════════════════════════════════════════════════════ */
  function openMisGustosModal() {
    const gustos = MisGustosManager.getAll();
    dlg.innerHTML = `
      <h3>🎴 PERFIL DE REFERENCIA: MIS_GUSTOS</h3>
      <p style="font-size:13px;margin:4px 0 10px">Estos son mis gustos y valores reales conocidos utilizados por el algoritmo de compatibilidad (1%–100%). Puedes activar/desactivar o ajustar el peso de cada dimensión:</p>
      <div class="gustos-grid">
        ${Object.entries(gustos).map(([key, item]) => `
          <div class="gusto-item">
            <div style="flex:1;min-width:210px">
              <b>${escapeHTML(item.label)}</b>
              <small>${escapeHTML(item.desc)}</small>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <label style="margin:0;font-size:12px">
                <span>Peso: <b id="lbl-w-${key}">${item.weight.toFixed(2)}x</b></span>
                <input type="range" data-gusto-w="${key}" min="0.5" max="2.5" step="0.05" value="${item.weight}" style="width:90px">
              </label>
              <input type="checkbox" data-gusto-en="${key}" ${item.enabled ? 'checked' : ''} title="Activar en el cálculo">
            </div>
          </div>
        `).join('')}
      </div>
      <div class="row" style="justify-content:space-between">
        <button type="button" class="btn sm" id="btn-reset-gustos">RESTAURAR PERFIL ORIGINAL</button>
        <button type="button" class="btn main" id="dlg-close">GUARDAR Y APLICAR</button>
      </div>
    `;
    dlg.showModal();

    dlg.querySelectorAll('[data-gusto-w]').forEach(inp => {
      inp.addEventListener('input', e => {
        const k = inp.dataset.gustoW;
        const val = parseFloat(e.target.value) || 1.0;
        gustos[k].weight = val;
        const lbl = document.getElementById(`lbl-w-${k}`);
        if (lbl) lbl.textContent = `${val.toFixed(2)}x`;
        MisGustosManager.save();
      });
    });

    dlg.querySelectorAll('[data-gusto-en]').forEach(chk => {
      chk.addEventListener('change', e => {
        const k = chk.dataset.gustoEn;
        gustos[k].enabled = !!e.target.checked;
        MisGustosManager.save();
      });
    });

    document.getElementById('btn-reset-gustos')?.addEventListener('click', () => {
      MisGustosManager.reset();
      openMisGustosModal();
      showToast('★ PERFIL MIS_GUSTOS RESTAURADO');
    });

    document.getElementById('dlg-close')?.addEventListener('click', () => {
      dlg.close();
      if (state.screen === 'stats' || state.screen === 'cards' || state.screen === 'letter') render();
    });
  }

  function openOnlineConfigModal() {
    const cfg = HallOfFameManager.getOnlineCfg();
    dlg.innerHTML = `
      <h3>🌐 ARQUITECTURA DE RANKING COMPARTIDO ONLINE</h3>
      <p style="font-size:13px;line-height:1.45">
        <b>Diferencia importante:</b> <code>localStorage</code> guarda todos los resultados de forma persistente en este navegador y dispositivo. Para que jugadores desde distintos dispositivos compartan una misma tabla global sin exponer claves privadas en el HTML, conecta un endpoint HTTPS propio (Cloudflare Worker, Supabase Edge Function o Node/Express) que valide y recalcule las respuestas del lado del servidor.
      </p>
      <label style="display:block;margin:10px 0">
        <span style="display:block;margin-bottom:4px">URL del Endpoint Backend (GET / POST JSON):</span>
        <input type="url" id="online-endpoint-input" class="p5-input" style="width:100%;font-size:13.5px" placeholder="https://tu-worker.tu-dominio.workers.dev/api/hall-of-fame" value="${escapeHTML(cfg.endpointUrl)}">
      </label>
      <label>
        <span>Activar sincronización con Backend Online</span>
        <input type="checkbox" id="online-enabled-chk" ${cfg.enabled ? 'checked' : ''}>
      </label>
      <div class="row" style="justify-content:space-between">
        <button type="button" class="btn sm" id="btn-sync-online-now">🔄 CONSULTAR RANKING REMOTO</button>
        <button type="button" class="btn main" id="dlg-close">GUARDAR</button>
      </div>
    `;
    dlg.showModal();

    document.getElementById('btn-sync-online-now')?.addEventListener('click', async () => {
      const urlVal = document.getElementById('online-endpoint-input')?.value || '';
      const enVal = document.getElementById('online-enabled-chk')?.checked || false;
      HallOfFameManager.saveOnlineCfg(urlVal, enVal);
      if (!urlVal) {
        showToast('Introduce primero la URL de tu endpoint backend');
        return;
      }
      try {
        const remote = await HallOfFameManager.fetchOnlineLeaderboard();
        if (remote) showToast(`★ RANKING REMOTO SINCRONIZADO (${remote.length} ENTRADAS)`);
        else showToast('Modo local activo: endpoint sin datos remotos');
      } catch (_) {
        showToast('No se pudo conectar al endpoint remoto; se mantiene localStorage');
      }
    });

    document.getElementById('dlg-close')?.addEventListener('click', () => {
      const urlVal = document.getElementById('online-endpoint-input')?.value || '';
      const enVal = document.getElementById('online-enabled-chk')?.checked || false;
      HallOfFameManager.saveOnlineCfg(urlVal, enVal);
      dlg.close();
      if (state.screen === 'hall') render();
    });
  }

  document.addEventListener('click', e => {
    const trigger = e.target.closest('[data-a]');
    if (!trigger) return;
    const action = trigger.dataset.a;

    if (action === 'hof') {
      go('hall', true);
      return;
    }

    if (action === 'gustos') {
      openMisGustosModal();
      return;
    }

    if (action === 'arch') {
      dlg.innerHTML = `
        <h3>★ ARCHIVO PHANTOM (${state.unlocked.size}/${ARCHIVE_ITEMS.length})</h3>
        <div style="display:flex;flex-direction:column;gap:8px;margin:12px 0">
          ${ARCHIVE_ITEMS.map(item => {
            const ok = state.unlocked.has(item.id);
            return `
              <div class="${ok ? '' : 'lock'}" style="padding:10px 12px;border:2px solid ${ok ? 'var(--p5-red)' : '#444'};background:rgba(0,0,0,.72)">
                <div style="font-weight:900;color:${ok ? '#fff' : '#888'}">${ok ? '★ ' + escapeHTML(item.title) : '🔒 BLOQUEADO'}</div>
                <div style="font-size:13px">${ok ? escapeHTML(item.desc) : 'Sigue jugando para desbloquear este registro.'}</div>
              </div>
            `;
          }).join('')}
        </div>
        <div class="row" style="justify-content:flex-end">
          <button type="button" class="btn main" id="dlg-close">CERRAR</button>
        </div>
      `;
      dlg.showModal();
      document.getElementById('dlg-close')?.addEventListener('click', () => dlg.close());
      return;
    }

    if (action === 'cfg') {
      const html = document.documentElement;
      dlg.innerHTML = `
        <h3>⚙ CONFIGURACIÓN, EVENTOS, AUDIO & ACCESIBILIDAD</h3>
        <label>
          <span>🔊 Efectos de Sonido (SFX)</span>
          <input type="checkbox" id="cfg-sfx" ${P5Audio.state.enabled ? 'checked' : ''}>
        </label>
        <label>
          <span>🎷 Música Ambiental (Acid-Jazz)</span>
          <input type="checkbox" id="cfg-bgm" ${P5Audio.state.bgm ? 'checked' : ''}>
        </label>
        <label>
          <span>🎚 Volumen Maestro</span>
          <input type="range" id="cfg-vol" min="0" max="1" step="0.05" value="${P5Audio.state.volume}">
        </label>
        <label>
          <span>🎲 Probabilidad Eventos Sorpresa (<b id="lbl-ev-chance">${Math.round(EVENT_CONFIG.chancePerStep * 100)}%</b>)</span>
          <input type="range" id="cfg-ev-chance" min="0" max="1" step="0.05" value="${EVENT_CONFIG.chancePerStep}">
        </label>
        <label>
          <span>🖼 Subir GIF / Imagen de Fondo Propia</span>
          <input type="file" id="cfg-gif-file" accept="image/*" style="max-width:175px;font-size:11px">
        </label>
        <label>
          <span>⏸ Pausar Animaciones del Metro</span>
          <input type="checkbox" id="cfg-pause" ${html.classList.contains('fx-paused') ? 'checked' : ''}>
        </label>
        <label>
          <span>♿ Reducir Movimiento (Accesibilidad)</span>
          <input type="checkbox" id="cfg-reduced" ${html.classList.contains('fx-reduced') ? 'checked' : ''}>
        </label>
        <div class="row" style="justify-content:space-between">
          <button type="button" class="btn sm" id="cfg-reset-bg">RESTAURAR METRO P5</button>
          <button type="button" class="btn main" id="dlg-close">LISTO</button>
        </div>
      `;
      dlg.showModal();

      document.getElementById('cfg-sfx')?.addEventListener('change', ev => P5Audio.setEnabled(ev.target.checked));
      document.getElementById('cfg-bgm')?.addEventListener('change', ev => P5Audio.setBgm(ev.target.checked));
      document.getElementById('cfg-vol')?.addEventListener('input', ev => P5Audio.setVolume(ev.target.value));
      document.getElementById('cfg-ev-chance')?.addEventListener('input', ev => {
        const val = parseFloat(ev.target.value) || 0;
        EVENT_CONFIG.chancePerStep = val;
        const lbl = document.getElementById('lbl-ev-chance');
        if (lbl) lbl.textContent = `${Math.round(val * 100)}%`;
        try { localStorage.setItem('six_ev_chance', String(val)); } catch (_) {}
      });
      document.getElementById('cfg-pause')?.addEventListener('change', ev => html.classList.toggle('fx-paused', ev.target.checked));
      document.getElementById('cfg-reduced')?.addEventListener('change', ev => html.classList.toggle('fx-reduced', ev.target.checked));
      document.getElementById('cfg-gif-file')?.addEventListener('change', ev => {
        const file = ev.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          FXStage.applyCustomBg(reader.result);
          showToast('★ GIF / IMAGEN DE FONDO APLICADA');
        };
        reader.readAsDataURL(file);
      });
      document.getElementById('cfg-reset-bg')?.addEventListener('click', () => {
        FXStage.applyCustomBg('');
        showToast('★ ESCENARIO DEL METRO RESTAURADO');
      });
      document.getElementById('dlg-close')?.addEventListener('click', () => dlg.close());
    }
  });

  /* Exponer API de pruebas internas para validación determinista */
  window.__SIX_SEVEN_TEST_API__ = {
    state,
    calcStats,
    HallOfFameManager,
    MisGustosManager,
    QUESTION_BANK,
    EVENT_BANK,
    startNewMatch,
    go
  };

  render();
})();
</script>
</body>
</html>
